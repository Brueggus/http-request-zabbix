[package]
name = "http-request-zabbix"
version = "0.2.1"
edition = "2024"
authors = ["Alexander Bakaldin"]
description = "A Rust client library for the Zabbix API"
license = "MIT"
repository = "https://github.com/alex-bakaldin/http-request-zabbix"
readme = "README.md"
keywords = ["zabbix", "api", "monitoring", "client", "http"]
categories = ["api-bindings"]

[features]
default = ["blocking"]
blocking = ["reqwest/blocking"]
async = []

[dependencies]
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "rustls",
] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.21.0", features = ["v4"] }

[dev-dependencies]
mockito = "1.7.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "login_with_password"
required-features = ["blocking"]

[[example]]
name = "login_with_token"
required-features = ["blocking"]

[[example]]
name = "string_request"
required-features = ["blocking"]

[[example]]
name = "async_login_with_password"
required-features = ["async"]
